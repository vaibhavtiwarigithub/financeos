name: Property evidence snapshots

on:
  workflow_dispatch:

concurrency:
  group: property-evidence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source_contract_check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: [maricopa-sales, tcad-appraisal]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Parser self-check
        run: python scripts/python/property_bulk_ingest.py --self-check
      - name: Confirm source remains disabled pending licence review
        run: python scripts/python/property_bulk_ingest.py --source "${{ matrix.source }}"
